<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --surface:#ffffff;
    --surface-2:#f5f4f0;
    --surface-3:#eae8e1;
    --text:#1c1c1a;
    --muted:#6b6b66;
    --muted-2:#9a9a94;
    --gold:#a3760d;
    --gold-dim:rgba(163,118,13,0.10);
    --teal:#1f6b5c;
    --teal-dim:rgba(31,107,92,0.10);
    --red:#ab3c2e;
    --red-dim:rgba(171,60,46,0.09);
    --border:rgba(20,20,15,0.09);
    --border-strong:rgba(20,20,15,0.18);
    --radius:10px;
    --shadow:0 8px 24px rgba(20,20,15,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(163,118,13,0.05), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(31,107,92,0.05), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .serif{font-family:'Spectral',serif;}
  a{color:var(--gold);}

  /* ---------- layout ---------- */
  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:280px;flex-shrink:0;background:var(--surface-2);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    padding:20px 16px;gap:18px;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 4px;}
  .brand-mark{
    width:34px;height:34px;border-radius:50%;
    border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Spectral',serif;font-weight:700;color:var(--gold);
    font-size:15px;flex-shrink:0;
  }
  .brand-name{font-family:'Spectral',serif;font-size:19px;font-weight:600;letter-spacing:0.2px;}
  .brand-sub{font-size:11px;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;}

  .side-section{display:flex;flex-direction:column;gap:6px;}
  .side-label{
    font-size:11px;text-transform:uppercase;letter-spacing:0.8px;
    color:var(--muted-2);padding:0 8px;margin-bottom:2px;
  }
  .trip-item{
    display:flex;flex-direction:column;gap:2px;
    padding:10px 10px;border-radius:8px;cursor:pointer;
    border:1px solid transparent;
  }
  .trip-item:hover{background:var(--surface-3);}
  .trip-item.active{background:#ffffff;border-color:var(--border-strong);box-shadow:var(--shadow);}
  .trip-item-name{font-size:14px;font-weight:600;}
  .trip-item-dates{font-size:11.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;}

  .btn{
    border:1px solid var(--border-strong);background:#ffffff;color:var(--text);
    padding:9px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;
    font-weight:500;transition:background .15s,border-color .15s;
  }
  .btn:hover{background:var(--surface-3);}
  .btn-gold{border-color:var(--gold);color:var(--gold);}
  .btn-gold:hover{background:var(--gold-dim);}
  .btn-teal{border-color:var(--teal);color:var(--teal);}
  .btn-teal:hover{background:var(--teal-dim);}
  .btn-red{border-color:var(--red);color:var(--red);}
  .btn-red:hover{background:var(--red-dim);}
  .btn-block{width:100%;}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--muted);}
  .btn-ghost:hover{background:var(--surface-3);color:var(--text);}

  .sidebar-footer{margin-top:auto;display:flex;flex-direction:column;gap:8px;}

  .main{flex:1;padding:28px 40px;overflow-y:auto;max-height:100vh;}
  .main-inner{max-width:960px;margin:0 auto;}

  .empty-state{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:70vh;text-align:center;color:var(--muted);gap:14px;
  }
  .empty-state h2{font-family:'Spectral',serif;color:var(--text);font-weight:600;}

  /* ---------- trip header ---------- */
  .trip-header{
    display:flex;justify-content:space-between;align-items:flex-start;
    padding-bottom:20px;margin-bottom:22px;border-bottom:1px solid var(--border);
  }
  .trip-title{font-family:'Spectral',serif;font-size:30px;font-weight:700;margin:0 0 6px;}
  .trip-dates{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);}
  .traveler-chips{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .chip{
    font-size:11.5px;padding:4px 10px;border-radius:20px;
    background:var(--surface-2);border:1px solid var(--border-strong);color:var(--muted);
  }

  /* ---------- view mode toggle ---------- */
  .view-toggle{display:flex;gap:6px;margin-bottom:20px;}
  .view-toggle button{
    border:1px solid var(--border-strong);background:#fff;color:var(--muted);
    padding:7px 16px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .view-toggle button.active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold);}

  /* ---------- country tabs (passport stamp style) ---------- */
  .country-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;}
  .country-tab{
    display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;
    border-radius:30px;border:1px solid var(--border-strong);background:#fff;
    cursor:pointer;transition:border-color .15s,background .15s;
  }
  .country-tab:hover{background:var(--surface-2);}
  .country-tab.active{border-color:var(--gold);background:var(--gold-dim);}
  .stamp{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;
    border:2px solid var(--muted-2);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;
    color:var(--muted-2);transition:all .2s;
  }
  .stamp.complete{
    border-color:var(--teal);color:var(--teal);
    box-shadow:0 0 0 2px var(--teal-dim);
    transform:rotate(-8deg);
  }
  .country-tab-name{font-size:13.5px;font-weight:600;}
  .add-country-tab{
    display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:30px;
    border:1px dashed var(--border-strong);color:var(--muted);cursor:pointer;font-size:13px;
  }
  .add-country-tab:hover{color:var(--text);border-color:var(--muted);}

  /* ---------- section cards ---------- */
  .section{margin-bottom:28px;}
  .section-head{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;
  }
  .section-title{
    font-family:'Spectral',serif;font-size:17px;font-weight:600;
    display:flex;align-items:center;gap:8px;
  }
  .section-title .count{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
    background:var(--surface-2);padding:2px 7px;border-radius:20px;
  }
  .card{
    background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px;position:relative;
  }
  .card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card-main{flex:1;min-width:0;}
  .card-title-line{font-weight:600;font-size:14.5px;margin-bottom:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .card-sub{font-size:12.5px;color:var(--muted);line-height:1.6;}
  .badge{
    font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600;
    text-transform:uppercase;letter-spacing:0.4px;
  }
  .badge-in{background:var(--teal-dim);color:var(--teal);}
  .badge-out{background:var(--gold-dim);color:var(--gold);}
  .badge-domestic{background:var(--surface-3);color:var(--muted);}
  .badge-done{background:var(--teal-dim);color:var(--teal);}
  .badge-todo{background:var(--red-dim);color:var(--red);}
  .card-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{
    width:26px;height:26px;border-radius:6px;border:1px solid var(--border);
    background:transparent;color:var(--muted);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:13px;
  }
  .icon-btn:hover{background:var(--surface-2);color:var(--text);}
  .icon-btn.done{border-color:var(--teal);color:var(--teal);background:var(--teal-dim);}

  .empty-row{
    color:var(--muted-2);font-size:13px;padding:16px;text-align:center;
    border:1px dashed var(--border);border-radius:var(--radius);
  }

  /* ---------- journey / timeline ---------- */
  .journey-completed-toggle{
    display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;
    cursor:pointer;margin-bottom:14px;padding:8px 12px;border:1px dashed var(--border-strong);
    border-radius:8px;
  }
  .journey-completed-toggle:hover{background:var(--surface-2);}
  .timeline{position:relative;padding-left:28px;}
  .timeline::before{
    content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;
    background:linear-gradient(var(--border-strong), var(--border));
  }
  .timeline-item{position:relative;margin-bottom:16px;}
  .timeline-dot{
    position:absolute;left:-28px;top:14px;width:20px;height:20px;border-radius:50%;
    background:#fff;border:2px solid var(--border-strong);
    display:flex;align-items:center;justify-content:center;font-size:10px;
  }
  .timeline-item.done .timeline-dot{border-color:var(--teal);background:var(--teal-dim);color:var(--teal);}
  .timeline-item.next .timeline-dot{border-color:var(--gold);background:var(--gold-dim);color:var(--gold);}
  .timeline-item.done .tcard{opacity:0.55;}
  .tcard{
    background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;
  }
  .timeline-item.next .tcard{border-color:var(--gold);box-shadow:var(--shadow);}
  .forms-callout{
    margin-top:10px;padding:10px 12px;background:var(--gold-dim);border:1px solid var(--gold);
    border-radius:8px;font-size:12.5px;
  }
  .forms-callout .fc-title{font-weight:600;color:var(--gold);margin-bottom:6px;}
  .forms-callout a{font-weight:600;}

  /* ---------- forms / modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(30,28,20,0.35);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal{
    background:#fff;border:1px solid var(--border-strong);border-radius:14px;
    width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    padding:24px;box-shadow:0 20px 50px rgba(20,20,15,0.18);
  }
  .modal.wide{max-width:640px;}
  .modal h3{font-family:'Spectral',serif;margin:0 0 16px;font-size:19px;}
  .field{margin-bottom:13px;}
  .field label{
    display:block;font-size:12px;color:var(--muted);margin-bottom:5px;
    text-transform:uppercase;letter-spacing:0.4px;
  }
  .field input, .field select, .field textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--border-strong);
    color:var(--text);padding:9px 10px;border-radius:7px;font-family:inherit;font-size:13.5px;
  }
  .field textarea{resize:vertical;min-height:56px;}
  .field-row{display:flex;gap:10px;}
  .field-row > *{flex:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .file-drop{
    border:1px dashed var(--border-strong);border-radius:8px;padding:14px;text-align:center;
    font-size:12.5px;color:var(--muted);cursor:pointer;
  }
  .file-drop:hover{border-color:var(--gold);color:var(--gold);}
  .file-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);
    border:1px solid var(--border-strong);padding:4px 9px;border-radius:20px;font-size:12px;margin-top:8px;
  }

  .top-toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%);
    background:var(--text);color:#fff;
    padding:9px 16px;border-radius:20px;font-size:12.5px;z-index:100;
    box-shadow:var(--shadow);
  }
  .top-toast.error{background:var(--red);}

  .staged-item{
    border:1px solid var(--border-strong);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--surface-2);
  }
  .staged-item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .staged-item-head .badge{background:var(--surface-3);color:var(--muted);}
  .import-progress{font-size:12.5px;color:var(--muted);margin:10px 0;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:20px;}

  @media(max-width:800px){
    .app{flex-direction:column;}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);flex-direction:row;overflow-x:auto;}
    .main{padding:20px;}
  }
</style>
</head>
<body>

<div id="setupOverlay" class="overlay" style="display:none;">
  <div class="modal">
    <h3>Connect Travel Dossier</h3>
    <p style="font-size:13px;color:var(--muted);margin-top:-8px;">
      Enter your Cloudflare Worker URL and access token (set once, stored only in this browser).
    </p>
    <div class="field">
      <label>Worker URL</label>
      <input id="setupUrl" placeholder="https://travel-dossier.yourname.workers.dev">
    </div>
    <div class="field">
      <label>Access token</label>
      <input id="setupToken" type="password" placeholder="API_SECRET value">
    </div>
    <div class="modal-actions">
      <button class="btn btn-gold" onclick="saveSetup()">Connect</button>
    </div>
  </div>
</div>

<div class="app">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark">TD</div>
      <div>
        <div class="brand-name">Travel Dossier</div>
        <div class="brand-sub">Trip records</div>
      </div>
    </div>

    <div class="side-section">
      <div class="side-label">Trips</div>
      <div id="tripList"></div>
    </div>
    <button class="btn btn-gold btn-block" onclick="openTripModal()">+ New trip</button>
    <button class="btn btn-teal btn-block" onclick="openImportModal()">⇧ Import documents</button>

    <div class="side-section">
      <div class="side-label">Travelers</div>
      <div id="travelerChipList" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
    </div>
    <button class="btn btn-block" onclick="openTravelerModal()">+ Manage travelers</button>

    <div class="sidebar-footer">
      <button class="btn btn-ghost btn-block" onclick="openSetup(true)">Connection settings</button>
    </div>
  </div>

  <div class="main">
    <div class="main-inner" id="mainContent"></div>
  </div>
</div>

<script>
/* ==================== STATE & PERSISTENCE ==================== */
let state = { travelers: [], trips: [] };
let activeTripId = null;
let activeCountryId = null;
let viewMode = 'journey'; // 'journey' | 'stops'
let showCompleted = false;
let cfg = { url: localStorage.getItem('td_url') || '', token: localStorage.getItem('td_token') || '' };
let saveTimer = null;

function uid(){ return crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2); }

function toast(msg, isError){
  const t = document.createElement('div');
  t.className = 'top-toast' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}

async function apiFetch(path, opts={}){
  if(!cfg.url || !cfg.token){ openSetup(false); throw new Error('not configured'); }
  const headers = Object.assign({ 'Authorization': 'Bearer ' + cfg.token }, opts.headers || {});
  const res = await fetch(cfg.url.replace(/\/$/,'') + path, Object.assign({}, opts, { headers }));
  if(res.status === 401){ toast('Invalid token — check connection settings', true); throw new Error('unauthorized'); }
  if(!res.ok){ const t = await res.text(); throw new Error(t || res.statusText); }
  return res;
}

async function loadState(){
  try{
    const res = await apiFetch('/api/data');
    const data = await res.json();
    if(data) state = data;
  }catch(e){
    console.warn('load failed', e);
  }
  migrateState();
  render();
}

// ensure older saved data gets the fields this version expects
function migrateState(){
  (state.trips||[]).forEach(t=>{
    (t.countries||[]).forEach(c=>{
      (c.flights||[]).forEach(f=>{ if(typeof f.completed !== 'boolean') f.completed = false; });
      (c.hotels||[]).forEach(h=>{ if(typeof h.completed !== 'boolean') h.completed = false; });
    });
  });
}

function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 500);
}

async function saveState(){
  try{
    await apiFetch('/api/data', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state)
    });
  }catch(e){
    toast('Save failed: ' + e.message, true);
  }
}

/* ==================== SETUP ==================== */
function openSetup(prefill){
  document.getElementById('setupUrl').value = prefill ? cfg.url : '';
  document.getElementById('setupToken').value = prefill ? cfg.token : '';
  document.getElementById('setupOverlay').style.display = 'flex';
}
function saveSetup(){
  const url = document.getElementById('setupUrl').value.trim();
  const token = document.getElementById('setupToken').value.trim();
  if(!url || !token){ toast('Enter both fields', true); return; }
  cfg = { url, token };
  localStorage.setItem('td_url', url);
  localStorage.setItem('td_token', token);
  document.getElementById('setupOverlay').style.display = 'none';
  loadState();
}
if(!cfg.url || !cfg.token){ openSetup(false); } else { loadState(); }

/* ==================== FILE HELPERS ==================== */
async function uploadFile(file){
  const fd = new FormData();
  fd.append('file', file);
  const res = await apiFetch('/api/upload', { method:'POST', body: fd });
  return await res.json(); // {fileId, filename, contentType, size}
}
async function viewFile(fileId, filename){
  try{
    const res = await apiFetch('/api/file/' + fileId);
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    window.open(blobUrl, '_blank');
  }catch(e){ toast('Could not open file: ' + e.message, true); }
}
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function extractFromFile(base64, mediaType, filename){
  const res = await apiFetch('/api/extract', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ base64, mediaType, filename })
  });
  const data = await res.json();
  return data.items || [];
}

/* ==================== DATA HELPERS ==================== */
function getTrip(id){ return state.trips.find(t=>t.id===id); }
function getCountry(trip, id){ return trip.countries.find(c=>c.id===id); }

function countryComplete(c){
  return c.flights.length>0 && c.hotels.length>0 && c.forms.every(f=>f.status==='done') && (c.forms.length===0 || c.forms.some(f=>f.status==='done'));
}
function countryCode(name){
  return (name||'??').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase() || '??';
}
function findCountryByName(trip, name){
  const n = (name||'').trim().toLowerCase();
  if(!n) return null;
  return trip.countries.find(c=>c.name.trim().toLowerCase()===n) || null;
}

/* ==================== RENDER: SIDEBAR ==================== */
function renderSidebar(){
  const list = document.getElementById('tripList');
  list.innerHTML = '';
  state.trips.slice().sort((a,b)=> (a.startDate||'').localeCompare(b.startDate||'')).forEach(t=>{
    const div = document.createElement('div');
    div.className = 'trip-item' + (t.id===activeTripId ? ' active' : '');
    div.onclick = ()=>{ activeTripId = t.id; activeCountryId = (t.countries[0]||{}).id || null; render(); };
    div.innerHTML = `<div class="trip-item-name">${esc(t.name)}</div>
      <div class="trip-item-dates">${esc(t.startDate||'—')} → ${esc(t.endDate||'—')}</div>`;
    list.appendChild(div);
  });
  if(state.trips.length===0){
    list.innerHTML = '<div style="font-size:12.5px;color:var(--muted-2);padding:8px;">No trips yet</div>';
  }

  const travList = document.getElementById('travelerChipList');
  travList.innerHTML = '';
  state.travelers.forEach(tr=>{
    const c = document.createElement('div');
    c.className = 'chip';
    c.textContent = tr.name;
    travList.appendChild(c);
  });
  if(state.travelers.length===0){
    travList.innerHTML = '<div style="font-size:12px;color:var(--muted-2);">No travelers added</div>';
  }
}

/* ==================== RENDER: MAIN ==================== */
function render(){
  renderSidebar();
  const main = document.getElementById('mainContent');
  const trip = getTrip(activeTripId);
  if(!trip){
    main.innerHTML = `<div class="empty-state">
      <h2>No trip selected</h2>
      <div>Create a trip, then import your PDFs/vouchers or add stops manually.</div>
      <button class="btn btn-gold" onclick="openTripModal()">+ New trip</button>
    </div>`;
    return;
  }
  if(!activeCountryId && trip.countries.length){ activeCountryId = trip.countries[0].id; }

  const travelerChips = (trip.travelerIds||[]).map(id=>{
    const t = state.travelers.find(x=>x.id===id);
    return t ? `<span class="chip">${esc(t.name)}</span>` : '';
  }).join('') || `<span class="chip" style="opacity:.6">No travelers assigned</span>`;

  main.innerHTML = `
    <div class="trip-header">
      <div>
        <h1 class="trip-title">${esc(trip.name)}</h1>

  `;

  if(viewMode === 'journey'){

  } else {

  }
}

function setViewMode(mode){ viewMode = mode; render(); }

/* ---------- Journey (timeline) view ---------- */
function buildTimeline(trip){
  const items = [];
  trip.countries.forEach(c=>{
    c.flights.forEach(f=>{
      items.push({
        kind:'flight', id:f.id, countryId:c.id, countryName:c.name,
        sortKey:(f.date||'9999-99-99')+' '+(f.time||'00:00'),
        completed: !!f.completed, data:f
      });
    });
    c.hotels.forEach(h=>{
      items.push({
        kind:'hotel', id:h.id, countryId:c.id, countryName:c.name,
        sortKey:(h.checkIn||'9999-99-99')+' 12:00',
        completed: !!h.completed, data:h
      });
    });
  });
  items.sort((a,b)=> a.sortKey.localeCompare(b.sortKey));
  return items;
}

function renderJourneyView(trip){
  const body = document.getElementById('viewBody');
  const items = buildTimeline(trip);
  if(items.length===0){
    body.innerHTML = `<div class="empty-row">No flights or hotels logged yet. Import documents or add a stop under "By stop".</div>`;
    return;
  }
  const completedItems = items.filter(i=>i.completed);
  const upcomingItems = items.filter(i=>!i.completed);

  let html = '';
  html += `<div class="journey-completed-toggle" onclick="toggleShowCompleted()">
    ${showCompleted ? '▾' : '▸'} Completed (${completedItems.length})
  </div>`;

  if(showCompleted && completedItems.length){
    html += `<div class="timeline">` + completedItems.map(i=>renderTimelineItem(trip, i, false)).join('') + `</div>`;
  }

  if(upcomingItems.length){
    html += `<div class="timeline">` + upcomingItems.map((i,idx)=>renderTimelineItem(trip, i, idx===0)).join('') + `</div>`;
  } else {
    html += `<div class="empty-row">All logged legs are marked complete 🎉</div>`;
  }

  body.innerHTML = html;
}

function renderTimelineItem(trip, item, isNext){
  const stateClass = item.completed ? 'done' : (isNext ? 'next' : '');
  const dotIcon = item.completed ? '✓' : (item.kind==='flight' ? '✈' : '🏨');
  let inner = '';

  if(item.kind==='flight'){
    const f = item.data;
    const badgeClass = f.direction==='arrival' ? 'badge-in' : (f.direction==='departure' ? 'badge-out':'badge-domestic');
    inner = `
      <div class="card-row">
        <div class="card-main">
          <div class="card-title-line">
            <span class="badge ${badgeClass}">${esc(f.direction)}</span>
            <span class="mono">${esc(f.flightNumber||'—')}</span>
            <span style="color:var(--muted);font-size:12.5px;">→ ${esc(item.countryName)}</span>
          </div>
          <div class="card-sub">${esc(f.from||'?')} → ${esc(f.to||'?')} &nbsp;·&nbsp; ${esc(f.date||'—')}${f.time?(' '+esc(f.time)):''}
            ${f.confirmationCode ? '&nbsp;·&nbsp; Conf: <span class="mono">'+esc(f.confirmationCode)+'</span>' : ''}</div>
          ${f.fileId ? `<div class="file-chip" style="cursor:pointer" onclick="viewFile('${f.fileId}','${esc(f.fileName||'')}')">📄 ${esc(f.fileName||'attachment')}</div>` : ''}
        </div>
        <div class="card-actions">
          <button class="icon-btn ${f.completed?'done':''}" onclick="toggleFlightDone('${trip.id}','${item.countryId}','${f.id}')">${f.completed?'✓':'○'}</button>
        </div>
      </div>`;
    if(f.direction==='arrival'){
      const c = getCountry(trip, item.countryId);
      if(c.forms && c.forms.length){
        inner += `<div class="forms-callout"><div class="fc-title">Entry forms for ${esc(c.name)}</div>` +
          c.forms.map(fo=>`<div>${fo.status==='done'?'✓':'•'} ${esc(fo.label)}${fo.url?` — <a href="${esc(fo.url)}" target="_blank" rel="noopener">open form</a>`:''}</div>`).join('') +
          `</div>`;
      }
    }
  } else {
    const h = item.data;
    inner = `
      <div class="card-row">
        <div class="card-main">
          <div class="card-title-line">${esc(h.name)} <span style="color:var(--muted);font-size:12.5px;font-weight:400;">— ${esc(item.countryName)}</span></div>
          <div class="card-sub">${esc(h.address||'')}<br>
            ${esc(h.checkIn||'—')} → ${esc(h.checkOut||'—')}
            ${h.confirmationCode ? '&nbsp;·&nbsp; Conf: <span class="mono">'+esc(h.confirmationCode)+'</span>' : ''}</div>
          ${h.fileId ? `<div class="file-chip" style="cursor:pointer" onclick="viewFile('${h.fileId}','${esc(h.fileName||'')}')">📄 ${esc(h.fileName||'attachment')}</div>` : ''}
        </div>
        <div class="card-actions">
          <button class="icon-btn ${h.completed?'done':''}" onclick="toggleHotelDone('${trip.id}','${item.countryId}','${h.id}')">${h.completed?'✓':'○'}</button>
        </div>
      </div>`;
  }

  return `<div class="timeline-item ${stateClass}">
    <div class="timeline-dot">${dotIcon}</div>
    <div class="tcard">${inner}</div>
  </div>`;
}

function toggleShowCompleted(){ showCompleted = !showCompleted; render(); }

function toggleFlightDone(tripId, countryId, flightId){
  const c = getCountry(getTrip(tripId), countryId);
  const f = c.flights.find(x=>x.id===flightId);
  f.completed = !f.completed;
  queueSave(); render();
}
function toggleHotelDone(tripId, countryId, hotelId){

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function updateCountryNotes(tripId, countryId, val){

  c.notes = val; queueSave();
}

/* ==================== MODAL FRAMEWORK ==================== */
function showModal(html, wide){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'dynModal';
  overlay.innerHTML = `<div class="modal${wide?' wide':''}">${html}</div>`;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  document.body.appendChild(overlay);
}
function closeModal(){ const m = document.getElementById('dynModal'); if(m) m.remove(); }

/* ---- Trip modal ---- */
function openTripModal(tripId){
  const trip = tripId ? getTrip(tripId) : null;
  showModal(`
    <h3>${trip?'Edit trip':'New trip'}</h3>
    <div class="field"><label>Trip name</label><input id="mTripName" value="${esc(trip?.name||'')}" placeholder="e.g. Asia — Sales trip July 2026"></div>
    <div class="field-row">
      <div class="field"><label>Start date</label><input id="mTripStart" type="date" value="${trip?.startDate||''}"></div>
      <div class="field"><label>End date</label><input id="mTripEnd" type="date" value="${trip?.endDate||''}"></div>
    </div>
    <div class="field">
      <label>Travelers on this trip</label>
      <div id="mTripTravelers" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold" onclick="saveTripModal('${trip?trip.id:''}')">Save</button>
    </div>
  `);
  const box = document.getElementById('mTripTravelers');
  if(state.travelers.length===0){
    box.innerHTML = '<div style="font-size:12px;color:var(--muted);">No travelers yet — add them from "Manage travelers".</div>';
  }
  state.travelers.forEach(t=>{
    const checked = trip && trip.travelerIds && trip.travelerIds.includes(t.id);
    const label = document.createElement('label');
    label.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:13px;background:var(--surface-2);padding:5px 10px;border-radius:20px;cursor:pointer;';
    label.innerHTML = `<input type="checkbox" value="${t.id}" ${checked?'checked':''} style="width:auto;"> ${esc(t.name)}`;
    box.appendChild(label);
  });
}
function saveTripModal(tripId){
  const name = document.getElementById('mTripName').value.trim();
  if(!name){ toast('Trip name is required', true); return; }
  const startDate = document.getElementById('mTripStart').value;
  const endDate = document.getElementById('mTripEnd').value;
  const travelerIds = Array.from(document.querySelectorAll('#mTripTravelers input:checked')).map(i=>i.value);
  if(tripId){
    const t = getTrip(tripId);
    Object.assign(t, { name, startDate, endDate, travelerIds });
  } else {
    const t = { id: uid(), name, startDate, endDate, travelerIds, countries: [] };
    state.trips.push(t);
    activeTripId = t.id;
  }
  queueSave(); closeModal(); render();
}
function deleteTrip(id){
  if(!confirm('Delete this trip and all its data?')) return;
  state.trips = state.trips.filter(t=>t.id!==id);
  if(activeTripId===id){ activeTripId = state.trips[0]?.id || null; activeCountryId = null; }
  queueSave(); render();
}

async function saveFlightModal(tripId, countryId, flightId){
  const trip = getTrip(tripId); const c = getCountry(trip, countryId);
  const data = {
    direction: document.getElementById('mFDirection').value,
    flightNumber: document.getElementById('mFNumber').value.trim(),
    confirmationCode: document.getElementById('mFConf').value.trim(),
    from: document.getElementById('mFFrom').value.trim(),
    to: document.getElementById('mFTo').value.trim(),
    date: document.getElementById('mFDate').value,
    time: document.getElementById('mFTime').value,
  };
  const fileInput = document.getElementById('mFFile');
  let existing = flightId ? c.flights.find(x=>x.id===flightId) : null;
  if(fileInput.files[0]){
    toast('Uploading file…');
    try{
      const up = await uploadFile(fileInput.files[0]);
      data.fileId = up.fileId; data.fileName = up.filename;
    }catch(e){ toast('Upload failed: ' + e.message, true); }
  } else if(existing){
    data.fileId = existing.fileId; data.fileName = existing.fileName;
  }
  if(existing){ Object.assign(existing, data); }
  else { c.flights.push(Object.assign({ id: uid(), completed:false }, data)); }
  queueSave(); closeModal(); render();
}
function deleteFlight(tripId, countryId, flightId){
  const c = getCountry(getTrip(tripId), countryId);
  c.flights = c.flights.filter(f=>f.id!==flightId);
  queueSave(); render();
}

/* ---- Hotel modal ---- */
function openHotelModal(tripId, countryId, hotelId){
  const trip = getTrip(tripId); const c = getCountry(trip, countryId);
  const h = hotelId ? c.hotels.find(x=>x.id===hotelId) : null;
  showModal(`
    <h3>${h?'Edit hotel':'Add hotel'}</h3>
    <div class="field"><label>Hotel name</label><input id="mHName" value="${esc(h?.name||'')}"></div>
    <div class="field"><label>Address</label><input id="mHAddress" value="${esc(h?.address||'')}"></div>
    <div class="field-row">
      <div class="field"><label>Check-in</label><input id="mHIn" type="date" value="${h?.checkIn||''}"></div>
      <div class="field"><label>Check-out</label><input id="mHOut" type="date" value="${h?.checkOut||''}"></div>
    </div>
    <div class="field"><label>Confirmation code</label><input id="mHConf" value="${esc(h?.confirmationCode||'')}"></div>
    <div class="field">
      <label>Attachment (voucher / confirmation)</label>
      <div class="file-drop" onclick="document.getElementById('mHFile').click()">
        ${h?.fileId ? '📄 '+esc(h.fileName||'attached — click to replace') : 'Click to upload PDF or image'}
      </div>
      <input type="file" id="mHFile" style="display:none" accept="application/pdf,image/*">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold" onclick="saveHotelModal('${tripId}','${countryId}','${hotelId||''}')">Save</button>
    </div>
  `);
}
async function saveHotelModal(tripId, countryId, hotelId){
  const trip = getTrip(tripId); const c = getCountry(trip, countryId);
  const data = {
    name: document.getElementById('mHName').value.trim(),
    address: document.getElementById('mHAddress').value.trim(),
    checkIn: document.getElementById('mHIn').value,
    checkOut: document.getElementById('mHOut').value,
    confirmationCode: document.getElementById('mHConf').value.trim(),
  };
  if(!data.name){ toast('Hotel name is required', true); return; }
  const fileInput = document.getElementById('mHFile');
  let existing = hotelId ? c.hotels.find(x=>x.id===hotelId) : null;
  if(fileInput.files[0]){
    toast('Uploading file…');
    try{
      const up = await uploadFile(fileInput.files[0]);
      data.fileId = up.fileId; data.fileName = up.filename;
    }catch(e){ toast('Upload failed: ' + e.message, true); }
  } else if(existing){
    data.fileId = existing.fileId; data.fileName = existing.fileName;
  }
  if(existing){ Object.assign(existing, data); }
  else { c.hotels.push(Object.assign({ id: uid(), completed:false }, data)); }
  queueSave(); closeModal(); render();
}
function deleteHotel(tripId, countryId, hotelId){
  const c = getCountry(getTrip(tripId), countryId);
  c.hotels = c.hotels.filter(h=>h.id!==hotelId);
  queueSave(); render();
}

/* ---- Form/link modal (arrival cards, e-visas, K-ETA, etc.) ---- */
function openFormModal(tripId, countryId, formId){
  const trip = getTrip(tripId); const c = getCountry(trip, countryId);
  const f = formId ? c.forms.find(x=>x.id===formId) : null;
  showModal(`
    <h3>${f?'Edit form / link':'Add form / link'}</h3>
    <div class="field"><label>Label</label><input id="mFoLabel" value="${esc(f?.label||'')}" placeholder="e.g. SG Arrival Card (SGAC)"></div>
    <div class="field"><label>Link (official portal / e-visa / confirmation)</label><input id="mFoUrl" value="${esc(f?.url||'')}" placeholder="https://"></div>
    <div class="field"><label>Status</label>
      <select id="mFoStatus">
        <option value="todo" ${f?.status!=='done'?'selected':''}>To do</option>
        <option value="done" ${f?.status==='done'?'selected':''}>Done</option>
      </select>
    </div>
    <div class="field"><label>Notes</label><textarea id="mFoNotes">${esc(f?.notes||'')}</textarea></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold" onclick="saveFormModal('${tripId}','${countryId}','${formId||''}')">Save</button>
    </div>
  `);
}
function saveFormModal(tripId, countryId, formId){
  const trip = getTrip(tripId); const c = getCountry(trip, countryId);
  const data = {
    label: document.getElementById('mFoLabel').value.trim(),
    url: document.getElementById('mFoUrl').value.trim(),
    status: document.getElementById('mFoStatus').value,
    notes: document.getElementById('mFoNotes').value.trim(),
  };
  if(!data.label){ toast('Label is required', true); return; }
  const existing = formId ? c.forms.find(x=>x.id===formId) : null;
  if(existing){ Object.assign(existing, data); }
  else { c.forms.push(Object.assign({ id: uid() }, data)); }
  queueSave(); closeModal(); render();
}
function toggleFormStatus(tripId, countryId, formId){
  const c = getCountry(getTrip(tripId), countryId);
  const f = c.forms.find(x=>x.id===formId);
  f.status = f.status==='done' ? 'todo' : 'done';
  queueSave(); render();
}
function deleteForm(tripId, countryId, formId){
  const c = getCountry(getTrip(tripId), countryId);
  c.forms = c.forms.filter(f=>f.id!==formId);
  queueSave(); render();
}

/* ---- Document modal (passport scans, insurance, misc uploads or links) ---- */
function openDocModal(tripId, countryId){
  showModal(`
    <h3>Add document</h3>
    <div class="field"><label>Label</label><input id="mDLabel" placeholder="e.g. Passport scan, Travel insurance"></div>
    <div class="field">
      <label>Upload a file, or paste a link instead</label>
      <div class="file-drop" onclick="document.getElementById('mDFile').click()">Click to upload PDF or image</div>
      <input type="file" id="mDFile" style="display:none" accept="application/pdf,image/*">
    </div>
    <div class="field"><label>Or link</label><input id="mDUrl" placeholder="https://"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold" onclick="saveDocModal('${tripId}','${countryId}')">Save</button>
    </div>
  `);
}
async function saveDocModal(tripId, countryId){
  const trip = getTrip(tripId); const c = getCountry(trip, countryId);
  const label = document.getElementById('mDLabel').value.trim();
  if(!label){ toast('Label is required', true); return; }
  const url = document.getElementById('mDUrl').value.trim();
  const fileInput = document.getElementById('mDFile');
  const doc = { id: uid(), label };
  if(fileInput.files[0]){
    toast('Uploading file…');

      const up = await uploadFile(fileInput.files[0]);
      doc.fileId = up.fileId; doc.fileName = up.filename;

  } else {
    toast('Attach a file or a link', true); return;

}
function deleteDoc(tripId, countryId, docId){

  c.documents = c.documents.filter(x=>x.id!==docId);
  queueSave(); render();
}

/* ---- Traveler management ---- */
function openTravelerModal(){
  showModal(`
    <h3>Travelers</h3>
    <div id="mTravelerList" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;"></div>
    <div class="field"><label>Name</label><input id="mNewTravName" placeholder="Full name"></div>
    <div class="field-row">
      <div class="field"><label>Nationality</label><input id="mNewTravNat" placeholder="e.g. Israeli"></div>
      <div class="field"><label>Passport number</label><input id="mNewTravPass" placeholder="Optional"></div>
    </div>
    <button class="btn btn-teal btn-block" onclick="addTraveler()">+ Add traveler</button>
    <div class="modal-actions">
      <button class="btn btn-gold" onclick="closeModal()">Done</button>
    </div>
  `);
  renderTravelerModalList();
}
function renderTravelerModalList(){
  const box = document.getElementById('mTravelerList');
  if(!box) return;
  box.innerHTML = '';
  if(state.travelers.length===0){
    box.innerHTML = '<div style="font-size:12.5px;color:var(--muted);">No travelers yet.</div>';
  }
  state.travelers.forEach(t=>{
    const row = document.createElement('div');
    row.className = 'card';
    row.style.margin = '0';
    row.innerHTML = `<div class="card-row">
      <div class="card-main">
        <div class="card-title-line">${esc(t.name)}</div>
        <div class="card-sub">${esc(t.nationality||'')}${t.passportNumber?(' · Passport '+esc(t.passportNumber)):''}</div>
      </div>
      <div class="card-actions"><button class="icon-btn" onclick="removeTraveler('${t.id}')">✕</button></div>
    </div>`;
    box.appendChild(row);
  });
}
function addTraveler(){
  const name = document.getElementById('mNewTravName').value.trim();
  if(!name){ toast('Name is required', true); return; }
  const nationality = document.getElementById('mNewTravNat').value.trim();
  const passportNumber = document.getElementById('mNewTravPass').value.trim();
  state.travelers.push({ id: uid(), name, nationality, passportNumber });
  document.getElementById('mNewTravName').value = '';
  document.getElementById('mNewTravNat').value = '';
  document.getElementById('mNewTravPass').value = '';
  queueSave(); renderTravelerModalList(); renderSidebar();
}
function removeTraveler(id){
  state.travelers = state.travelers.filter(t=>t.id!==id);
  state.trips.forEach(t=>{ t.travelerIds = (t.travelerIds||[]).filter(x=>x!==id); });
  queueSave(); renderTravelerModalList(); render();
}

/* ==================== IMPORT DOCUMENTS (extraction) ==================== */
let stagedItems = []; // {localId, type, ...fields, sourceFileId, sourceFileName}

function openImportModal(){
  if(state.trips.length===0){
    toast('Create a trip first', true);
    return;
  }
  stagedItems = [];
  const tripOptions = state.trips.map(t=>`<option value="${t.id}" ${t.id===activeTripId?'selected':''}>${esc(t.name)}</option>`).join('');
  showModal(`
    <h3>Import documents</h3>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-8px;">
      Upload e-tickets, boarding passes, or hotel vouchers (PDF or image). The tool reads them and
      drafts the flights/hotels for you to review before adding.
    </p>
    <div class="field"><label>Trip</label><select id="mImportTrip">${tripOptions}</select></div>
    <div class="field">
      <div class="file-drop" onclick="document.getElementById('mImportFiles').click()">Click to select one or more files</div>
      <input type="file" id="mImportFiles" style="display:none" accept="application/pdf,image/*" multiple>
    </div>
    <div id="importProgress"></div>
    <div id="importStaged"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-teal" id="importConfirmBtn" style="display:none" onclick="confirmImport()">Add all to trip</button>
    </div>
  `, true);
  document.getElementById('mImportFiles').addEventListener('change', handleImportFiles);
}

async function handleImportFiles(e){
  const files = Array.from(e.target.files || []);
  if(!files.length) return;
  const progress = document.getElementById('importProgress');
  for(let i=0;i<files.length;i++){
    const file = files[i];
    progress.innerHTML = `<div class="import-progress">Processing ${i+1} / ${files.length}: ${esc(file.name)}…</div>`;
    try{
      const [uploadResult, base64] = await Promise.all([ uploadFile(file), fileToBase64(file) ]);
      const items = await extractFromFile(base64, file.type || 'application/pdf', file.name);
      items.forEach(it=>{
        stagedItems.push(Object.assign({ localId: uid(), sourceFileId: uploadResult.fileId, sourceFileName: uploadResult.filename }, it));
      });
      if(items.length===0){
        toast(`No flight/hotel details found in ${file.name}`, true);
      }
    }catch(err){
      toast('Could not process ' + file.name + ': ' + err.message, true);
    }
  }
  progress.innerHTML = '';
  renderStagedItems();
}

function renderStagedItems(){
  const box = document.getElementById('importStaged');
  const confirmBtn = document.getElementById('importConfirmBtn');
  if(stagedItems.length===0){ box.innerHTML=''; confirmBtn.style.display='none'; return; }
  confirmBtn.style.display = 'inline-block';
  box.innerHTML = `<div style="font-size:12px;color:var(--muted);margin:10px 0 4px;">Review and edit before adding (${stagedItems.length} item(s)):</div>`;
  stagedItems.forEach(it=>{
    const div = document.createElement('div');
    div.className = 'staged-item';
    if(it.type==='flight'){
      div.innerHTML = `
        <div class="staged-item-head">
          <span class="badge">Flight — from ${esc(it.sourceFileName)}</span>
          <button class="icon-btn" onclick="removeStagedItem('${it.localId}')">✕</button>
        </div>
        <div class="field-row">
          <div class="field"><label>Country</label><input value="${esc(it.countryGuess||'')}" onchange="updateStaged('${it.localId}','countryGuess',this.value)"></div>
          <div class="field"><label>Direction</label>
            <select onchange="updateStaged('${it.localId}','direction',this.value)">
              <option value="arrival" ${it.direction==='arrival'?'selected':''}>Arrival</option>
              <option value="departure" ${it.direction==='departure'?'selected':''}>Departure</option>
              <option value="domestic" ${it.direction==='domestic'?'selected':''}>Domestic</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Flight #</label><input value="${esc(it.flightNumber||'')}" onchange="updateStaged('${it.localId}','flightNumber',this.value)"></div>
          <div class="field"><label>Confirmation</label><input value="${esc(it.confirmationCode||'')}" onchange="updateStaged('${it.localId}','confirmationCode',this.value)"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>From</label><input value="${esc(it.from||'')}" onchange="updateStaged('${it.localId}','from',this.value)"></div>
          <div class="field"><label>To</label><input value="${esc(it.to||'')}" onchange="updateStaged('${it.localId}','to',this.value)"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Date</label><input type="date" value="${it.date||''}" onchange="updateStaged('${it.localId}','date',this.value)"></div>
          <div class="field"><label>Time</label><input type="time" value="${it.time||''}" onchange="updateStaged('${it.localId}','time',this.value)"></div>
        </div>
      `;
    } else {
      div.innerHTML = `
        <div class="staged-item-head">
          <span class="badge">Hotel — from ${esc(it.sourceFileName)}</span>
          <button class="icon-btn" onclick="removeStagedItem('${it.localId}')">✕</button>
        </div>
        <div class="field"><label>Country</label><input value="${esc(it.countryGuess||'')}" onchange="updateStaged('${it.localId}','countryGuess',this.value)"></div>
        <div class="field"><label>Hotel name</label><input value="${esc(it.name||'')}" onchange="updateStaged('${it.localId}','name',this.value)"></div>
        <div class="field"><label>Address</label><input value="${esc(it.address||'')}" onchange="updateStaged('${it.localId}','address',this.value)"></div>
        <div class="field-row">
          <div class="field"><label>Check-in</label><input type="date" value="${it.checkIn||''}" onchange="updateStaged('${it.localId}','checkIn',this.value)"></div>
          <div class="field"><label>Check-out</label><input type="date" value="${it.checkOut||''}" onchange="updateStaged('${it.localId}','checkOut',this.value)"></div>
        </div>
        <div class="field"><label>Confirmation</label><input value="${esc(it.confirmationCode||'')}" onchange="updateStaged('${it.localId}','confirmationCode',this.value)"></div>
      `;
    }
    box.appendChild(div);
  });
}
function updateStaged(localId, field, value){
  const it = stagedItems.find(x=>x.localId===localId);
  if(it) it[field] = value;
}
function removeStagedItem(localId){
  stagedItems = stagedItems.filter(x=>x.localId!==localId);
  renderStagedItems();
}

function confirmImport(){
  const tripId = document.getElementById('mImportTrip').value;
  const trip = getTrip(tripId);
  if(!trip){ toast('Select a trip', true); return; }

  stagedItems.forEach(it=>{
    let country = findCountryByName(trip, it.countryGuess);
    if(!country){
      country = { id: uid(), name: (it.countryGuess||'Unspecified').trim() || 'Unspecified', flights: [], hotels: [], forms: [], documents: [], notes: '' };
      trip.countries.push(country);
    }
    if(it.type==='flight'){
      country.flights.push({
        id: uid(), completed:false,
        direction: it.direction||'arrival', flightNumber: it.flightNumber||'', confirmationCode: it.confirmationCode||'',
        from: it.from||'', to: it.to||'', date: it.date||'', time: it.time||'',
        fileId: it.sourceFileId, fileName: it.sourceFileName,
      });
    } else {
      country.hotels.push({
        id: uid(), completed:false,
        name: it.name||'', address: it.address||'', checkIn: it.checkIn||'', checkOut: it.checkOut||'',
        confirmationCode: it.confirmationCode||'',
        fileId: it.sourceFileId, fileName: it.sourceFileName,
      });
    }
  });

  activeTripId = trip.id;
  activeCountryId = trip.countries[0]?.id || null;
  toast(`Added ${stagedItems.length} item(s) to ${trip.name}`);
  stagedItems = [];
  queueSave(); closeModal(); render();
}
</script>
